<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trust in Automation (TiA) - V2P Main Study</title>
<style>
  :root{
    --ink:#1c2024;
    --ink-soft:#5a6168;
    --paper:#f7f6f3;
    --panel:#ffffff;
    --line:#dcd9d2;
    --accent:#2b5797;
    --accent-soft:#e8eef6;
    --warn:#a6420f;
    --warn-soft:#fbeee5;
    --good:#2f6e4e;
    --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
    --serif:'Source Serif Pro',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .shell{max-width:720px;margin:0 auto;padding:28px 20px 80px;}

  .labelband{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;}
  .labelband .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .labelband .title{font-family:var(--serif);font-size:20px;font-weight:600;}

  .meta-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .meta-card h2{font-family:var(--serif);font-size:16px;margin:0 0 14px;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:6px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;font-size:14px;font-family:var(--sans);background:#fff;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px 24px 20px;margin-bottom:18px;}
  .card h2{font-family:var(--serif);font-size:17px;margin:0 0 4px;}
  .card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:6px;line-height:1.5;}
  .step-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}

  .item{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:none;margin-bottom:0;}
  .item .qtext{font-size:14px;line-height:1.5;margin-bottom:10px;}
  .item .qid{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-right:6px;}
  .tia-answer-row{display:flex;align-items:flex-start;gap:14px;}
  .tia-scale-group{flex:1;min-width:0;}
  .radio-grid{display:flex;gap:8px;}
  .radio-pill{border:1px solid var(--line);padding:9px 0;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;flex:1;text-align:center;font-family:var(--mono);}
  .radio-pill.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .radio-pill.no-answer-pill{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-soft);border-style:dashed;width:52px;flex:0 0 auto;align-self:flex-start;}
  .radio-pill.no-answer-pill.sel{background:var(--warn);border-color:var(--warn);color:#fff;}
  .scale-endlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:4px;font-family:var(--mono);}

  .btn-row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;}
  button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:2px;border:1px solid var(--ink);cursor:pointer;background:var(--ink);color:#fff;}
  button.ghost{background:transparent;color:var(--ink);}
  button:disabled{opacity:.4;cursor:not-allowed;}

  .banner{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;font-size:12.5px;line-height:1.5;border-radius:0 2px 2px 0;margin-bottom:18px;}
  .banner.warn{border-left-color:var(--warn);background:var(--warn-soft);}

  .export-box{background:#11141a;color:#d7e3f4;border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:11px;line-height:1.6;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-bottom:14px;}
  footer.note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:30px;font-family:var(--mono);}

  .summary-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .summary-table th,.summary-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  .summary-table th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="shell" id="shell"></div>

<script>
/* ============================================================
   TRUST IN AUTOMATION (TiA) -- Koerber (2019), 19 items
   STANDALONE QUESTIONNAIRE
   3-step flow: 1) session data, 2) all 19 items (incl. No Answer
   option per item), 3) review (for the experimenter) + download.
   Item wording verified against the official English TiA PDF
   (CC BY-SA 4.0). Subscale assignment and reverse-coding
   cross-verified against peer-reviewed applications of the
   validated 19-item version. Native 1-5 Likert scale.
   ============================================================ */

// [id, subscaleCode, subscaleName, text, reverse]
const TIA_ITEMS = [
  [1,  'REL',  'Reliability/Competence',            'The system is capable of interpreting situations correctly.', false],
  [2,  'UND',  'Understandability/Predictability',  'The system state was always clear to me.', false],
  [3,  'FAM',  'Familiarity',                        'I already know similar systems.', false],
  [4,  'DEV',  'Intention of Developers',            'The developers are trustworthy.', false],
  [5,  'PROP', 'Propensity to Trust',                'One should be careful with unfamiliar automated systems.', true],
  [6,  'REL',  'Reliability/Competence',            'The system works reliably.', false],
  [7,  'UND',  'Understandability/Predictability',  'The system reacts unpredictably.', true],
  [8,  'DEV',  'Intention of Developers',            'The developers take my well-being seriously.', false],
  [9,  'TRU',  'Trust in Automation (core)',         'I trust the system.', false],
  [10, 'REL',  'Reliability/Competence',            'A system malfunction is likely.', true],
  [11, 'UND',  'Understandability/Predictability',  'I was able to understand why things happened.', false],
  [12, 'PROP', 'Propensity to Trust',                'I rather trust a system than I mistrust it.', false],
  [13, 'REL',  'Reliability/Competence',            'The system is capable of taking over complicated tasks.', false],
  [14, 'TRU',  'Trust in Automation (core)',         'I can rely on the system.', false],
  [15, 'REL',  'Reliability/Competence',            'The system might make sporadic errors.', true],
  [16, 'UND',  'Understandability/Predictability',  'It is difficult to identify what the system will do next.', true],
  [17, 'FAM',  'Familiarity',                        'I have already used similar systems.', false],
  [18, 'PROP', 'Propensity to Trust',                'Automated systems generally work well.', false],
  [19, 'REL',  'Reliability/Competence',            "I am confident about the system's capabilities.", false],
];

const SUBSCALE_NAMES = {
  REL: 'Reliability/Competence',
  UND: 'Understandability/Predictability',
  FAM: 'Familiarity',
  DEV: 'Intention of Developers',
  PROP: 'Propensity to Trust',
  TRU: 'Trust in Automation (core)',
};

let meta = { pid:'', date:new Date().toISOString().slice(0,10), condition:'Adaptive System', order:'1st (first block completed)' };
let tia = {};
// Items start truly unanswered (key absent from object). Once the
// participant clicks a pill, the value becomes either a number (1-5)
// or the string 'na' (explicit No Answer). This three-state model lets
// us distinguish "not yet answered" (blocks progression) from
// "explicitly marked N/A" (does NOT block progression).
let step = 1; // 1 = session data, 2 = items, 3 = review

function isAnswered(id){
  return Object.prototype.hasOwnProperty.call(tia, id);
}

function render(){
  const shell = document.getElementById('shell');
  shell.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'labelband';
  header.innerHTML = `<div class="title">Trust in Automation (TiA)</div><div class="tag">V2P Main Study</div>`;
  shell.appendChild(header);

  if(step === 1) renderStep1(shell);
  else if(step === 2) renderStep2(shell);
  else renderStep3(shell);

  const footnote = document.createElement('footer');
  footnote.className = 'note';
  footnote.textContent = 'Trust in Automation (TiA), Koerber (2019) -- V2P Adaptive Warning Study';
  shell.appendChild(footnote);
}

/* ---------------- STEP 1: SESSION DATA ---------------- */
function renderStep1(shell){
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = 'Step 1 of 3: Enter the session details below, then continue to the questionnaire.';
  shell.appendChild(banner);

  const metaCard = document.createElement('div');
  metaCard.className = 'meta-card';
  metaCard.innerHTML = `
    <h2>Session Details</h2>
    <div class="meta-grid">
      <div class="field"><label>Participant ID</label><input type="text" id="m_pid" placeholder="P01" value="${meta.pid}"></div>
      <div class="field"><label>Session date</label><input type="text" id="m_date" value="${meta.date}"></div>
      <div class="field"><label>Condition</label>
        <select id="m_condition">
          <option value="Adaptive System" ${meta.condition==='Adaptive System'?'selected':''}>Adaptive System</option>
          <option value="Fixed Baseline" ${meta.condition==='Fixed Baseline'?'selected':''}>Fixed Baseline</option>
        </select>
      </div>
      <div class="field"><label>Block order</label>
        <select id="m_order">
          <option value="1st (first block completed)" ${meta.order.startsWith('1st')?'selected':''}>1st (first block completed)</option>
          <option value="2nd (second block completed)" ${meta.order.startsWith('2nd')?'selected':''}>2nd (second block completed)</option>
        </select>
      </div>
    </div>
  `;
  shell.appendChild(metaCard);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  btnRow.innerHTML = `<span></span>`;
  const next = document.createElement('button');
  next.textContent = 'Continue to Questionnaire ->';
  next.onclick = () => {
    if(!meta.pid.trim()){ alert('Please enter a Participant ID before continuing.'); return; }
    step = 2; render();
  };
  btnRow.appendChild(next);
  shell.appendChild(btnRow);

  document.getElementById('m_pid').oninput = e => { meta.pid = e.target.value; };
  document.getElementById('m_date').oninput = e => { meta.date = e.target.value; };
  document.getElementById('m_condition').onchange = e => { meta.condition = e.target.value; };
  document.getElementById('m_order').onchange = e => { meta.order = e.target.value; };
}

/* ---------------- STEP 2: ITEMS ---------------- */
function renderStep2(shell){
  const answered = TIA_ITEMS.filter(it => isAnswered(it[0])).length;
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `Step 2 of 3: Rate your agreement with each statement about the warning system you just experienced. 1 = Strongly disagree, 5 = Strongly agree (or mark N/A). ${answered}/19 answered.`;
  shell.appendChild(banner);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="step-tag">Questionnaire</div><h2>Trust Statements</h2>`;

  TIA_ITEMS.forEach(([id, code, name, text]) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="qtext"><span class="qid">${id}</span>${text}</div>
      <div class="tia-answer-row">
        <div class="tia-scale-group">
          <div class="radio-grid" id="tia_${id}_pills">
            ${[1,2,3,4,5].map(v => `<span class="radio-pill${v===tia[id]?' sel':''}" data-v="${v}">${v}</span>`).join('')}
          </div>
          <div class="scale-endlabels"><span>Strongly disagree</span><span>Strongly agree</span></div>
        </div>
        <span class="radio-pill no-answer-pill${tia[id]==='na'?' sel':''}" id="tia_${id}_na" data-v="na">N/A</span>
      </div>
    `;
    card.appendChild(row);
  });
  shell.appendChild(card);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const back = document.createElement('button');
  back.className = 'ghost';
  back.textContent = '<- Back to Session Details';
  back.onclick = () => { step = 1; render(); };
  const next = document.createElement('button');
  next.textContent = 'Continue to Review ->';
  next.disabled = answered < 19;
  next.onclick = () => {
    if(TIA_ITEMS.every(it => isAnswered(it[0]))){ step = 3; render(); }
  };
  btnRow.appendChild(back);
  btnRow.appendChild(next);
  shell.appendChild(btnRow);

  TIA_ITEMS.forEach(([id]) => {
    const ratingWrap = document.getElementById(`tia_${id}_pills`);
    const naPill = document.getElementById(`tia_${id}_na`);
    const allPills = [...ratingWrap.querySelectorAll('.radio-pill'), naPill];
    allPills.forEach(p => {
      p.onclick = () => {
        tia[id] = (p.dataset.v === 'na') ? 'na' : parseInt(p.dataset.v);
        render(); // re-render step 2 to update selection state, counter, and button
      };
    });
  });
}

/* ---------------- STEP 3: REVIEW (FOR THE EXPERIMENTER) ---------------- */
function buildExportObject(){
  const subscaleVals = { REL:[], UND:[], FAM:[], DEV:[], PROP:[], TRU:[] };
  const itemsDetail = {};
  let unansweredCount = 0;
  TIA_ITEMS.forEach(([id, code, name, text, reverse]) => {
    const raw = tia[id];
    if(raw === 'na' || raw === undefined){
      itemsDetail[id] = { raw: null, normalized: null, subscale: code, reverse };
      unansweredCount += 1;
      return; // excluded from subscale mean, not counted as neutral/zero
    }
    const norm = reverse ? (6 - raw) : raw;
    itemsDetail[id] = { raw, normalized: norm, subscale: code, reverse };
    subscaleVals[code].push(norm);
  });
  const subscaleMeans = {};
  Object.keys(subscaleVals).forEach(code => {
    const vals = subscaleVals[code];
    subscaleMeans[SUBSCALE_NAMES[code]] = vals.length
      ? Math.round((vals.reduce((a,b)=>a+b,0) / vals.length) * 100) / 100
      : null;
  });

  return {
    instrument: 'Trust in Automation (TiA), Koerber 2019',
    participant_id: meta.pid,
    session_date: meta.date,
    condition: meta.condition,
    block_order: meta.order,
    items: itemsDetail,
    subscale_means: subscaleMeans,
    unanswered_item_count: unansweredCount,
    exported_at: new Date().toISOString(),
  };
}

function renderStep3(shell){
  const obj = buildExportObject();

  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = 'Step 3 of 3: Review and download. Data is kept only in this browser tab until you download.';
  shell.appendChild(banner);

  if(obj.unanswered_item_count > 0){
    const warnBanner = document.createElement('div');
    warnBanner.className = 'banner warn';
    warnBanner.innerHTML = `${obj.unanswered_item_count} item(s) marked N/A and excluded from subscale means.`;
    shell.appendChild(warnBanner);
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="step-tag">For the Experimenter</div><h2>Review Before Download</h2><div class="sub">Check the participant ID, condition, and subscale scores below before saving the file.</div>`;

  const table = document.createElement('table');
  table.className = 'summary-table';
  let rows = `
    <tr><th>Field</th><th>Value</th></tr>
    <tr><td>Participant ID</td><td>${obj.participant_id}</td></tr>
    <tr><td>Session date</td><td>${obj.session_date}</td></tr>
    <tr><td>Condition</td><td>${obj.condition}</td></tr>
    <tr><td>Block order</td><td>${obj.block_order}</td></tr>
  `;
  Object.entries(obj.subscale_means).forEach(([name, val]) => {
    rows += `<tr><td>${name}</td><td>${val === null ? '(unanswered)' : val}</td></tr>`;
  });
  table.innerHTML = rows;
  card.appendChild(table);
  shell.appendChild(card);

  const exportCard = document.createElement('div');
  exportCard.className = 'card';
  exportCard.innerHTML = `<div class="sub" style="margin-bottom:14px;">Full export data:</div>`;
  const pre = document.createElement('div');
  pre.className = 'export-box';
  pre.textContent = JSON.stringify(obj, null, 2);
  exportCard.appendChild(pre);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const back = document.createElement('button');
  back.className = 'ghost';
  back.textContent = '<- Back to Questionnaire';
  back.onclick = () => { step = 2; render(); };
  const dlGroup = document.createElement('div');
  dlGroup.style.cssText = 'display:flex;gap:10px;';
  const dlCsvBtn = document.createElement('button');
  dlCsvBtn.className = 'ghost';
  dlCsvBtn.textContent = 'Download CSV row';
  dlCsvBtn.onclick = downloadCsv;
  const dlJsonBtn = document.createElement('button');
  dlJsonBtn.textContent = 'Download JSON';
  dlJsonBtn.onclick = downloadJson;
  dlGroup.appendChild(dlCsvBtn);
  dlGroup.appendChild(dlJsonBtn);
  btnRow.appendChild(back);
  btnRow.appendChild(dlGroup);
  exportCard.appendChild(btnRow);
  shell.appendChild(exportCard);
}

function downloadJson(){
  if(!meta.pid.trim()){ alert('Please enter a Participant ID before downloading.'); return; }
  const obj = buildExportObject();
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${meta.pid}_TiA_${meta.condition.replace(/\s+/g,'')}_${meta.date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadCsv(){
  if(!meta.pid.trim()){ alert('Please enter a Participant ID before downloading.'); return; }
  const obj = buildExportObject();
  const csvSafe = v => (v === null || v === undefined) ? '' : v;
  const headers = ['participant_id','session_date','condition','block_order',
    ...TIA_ITEMS.map(it=>'TiA_'+it[0]+'_raw'),
    ...Object.values(SUBSCALE_NAMES).map(n=>'subscale_'+n.replace(/[^a-zA-Z0-9]+/g,'_')),
    'unanswered_item_count'];
  const row = [obj.participant_id, obj.session_date, obj.condition, obj.block_order,
    ...TIA_ITEMS.map(it=>csvSafe(obj.items[it[0]].raw)),
    ...Object.values(SUBSCALE_NAMES).map(n=>csvSafe(obj.subscale_means[n])),
    obj.unanswered_item_count];
  const csv = headers.join(',') + '\n' + row.join(',');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${meta.pid}_TiA_${meta.condition.replace(/\s+/g,'')}_${meta.date}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
