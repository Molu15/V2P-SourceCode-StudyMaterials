<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NASA-TLX - V2P Main Study</title>
<style>
  :root{
    --ink:#1c2024;
    --ink-soft:#5a6168;
    --paper:#f7f6f3;
    --panel:#ffffff;
    --line:#dcd9d2;
    --accent:#2b5797;
    --accent-soft:#e8eef6;
    --warn:#a6420f;
    --warn-soft:#fbeee5;
    --good:#2f6e4e;
    --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
    --serif:'Source Serif Pro',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .shell{max-width:720px;margin:0 auto;padding:28px 20px 80px;}

  .labelband{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;}
  .labelband .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .labelband .title{font-family:var(--serif);font-size:20px;font-weight:600;}

  .meta-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .meta-card h2{font-family:var(--serif);font-size:16px;margin:0 0 14px;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:6px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;font-size:14px;font-family:var(--sans);background:#fff;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px 24px 20px;margin-bottom:18px;}
  .card h2{font-family:var(--serif);font-size:17px;margin:0 0 4px;}
  .card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:6px;line-height:1.5;}

  .step-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}

  .item{margin-bottom:26px;padding-bottom:20px;border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:none;margin-bottom:0;}
  .item .qtext{font-size:14.5px;font-weight:600;margin-bottom:3px;}
  .item .qdesc{font-size:13px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}
  .scale-row{display:flex;align-items:center;gap:12px;}
  .scale-row input[type=range]{flex:1;accent-color:var(--accent);height:5px;}
  .scale-endlabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:5px;font-family:var(--mono);}
  .scale-value{font-family:var(--mono);font-size:14px;width:42px;text-align:center;background:var(--accent-soft);border-radius:2px;padding:4px 0;color:var(--accent);font-weight:600;}

  .pair-item{margin-bottom:14px;padding:14px;border:1px solid var(--line);border-radius:2px;background:#fcfcfb;}
  .pair-counter{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-bottom:10px;}
  .pair-choice-row{display:flex;gap:10px;}
  .pair-choice{
    flex:1;border:1px solid var(--line);border-radius:2px;padding:14px 10px;text-align:center;
    cursor:pointer;background:#fff;font-size:14px;font-weight:600;
  }
  .pair-choice.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .pair-vs{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:flex;align-items:center;padding:0 4px;}

  .btn-row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;}
  button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:2px;border:1px solid var(--ink);cursor:pointer;background:var(--ink);color:#fff;}
  button.ghost{background:transparent;color:var(--ink);}
  button:disabled{opacity:.4;cursor:not-allowed;}

  .banner{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;font-size:12.5px;line-height:1.5;border-radius:0 2px 2px 0;margin-bottom:18px;}
  .banner.warn{border-left-color:var(--warn);background:var(--warn-soft);}

  .export-box{background:#11141a;color:#d7e3f4;border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:11px;line-height:1.6;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-bottom:14px;}
  footer.note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:30px;font-family:var(--mono);}

  .weights-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .weights-table th,.weights-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  .weights-table th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="shell" id="shell"></div>

<script>
/* ============================================================
   NASA-TLX -- FULL VERSION (Part 1: Ratings, Part 2: Weights)
   Hart & Staveland (1988). Official 21-point (0-100 by 5) rating
   scale for Part 1. Part 2: 15 pairwise comparisons across the
   6 dimensions; weight per dimension = number of times it was
   chosen as more relevant (0-5, sums to 15 across all dimensions).
   Weighted TLX score = sum(rating_i * weight_i) / 15.
   Raw TLX score (unweighted mean of the 6 ratings) is also
   reported, since both are commonly published (Hart, 2006).
   In-memory only; download button produces JSON + CSV at the end.
   ============================================================ */

const DIMENSIONS = [
  {id:'mental', label:'Mental Demand', short:'MD', desc:'How mentally demanding was the task?'},
  {id:'physical', label:'Physical Demand', short:'PD', desc:'How physically demanding was the task?'},
  {id:'temporal', label:'Temporal Demand', short:'TD', desc:'How hurried or rushed was the pace of the task?'},
  {id:'performance', label:'Performance', short:'OP', desc:'How successful were you in accomplishing what you were asked to do?'},
  {id:'effort', label:'Effort', short:'EF', desc:'How hard did you have to work to accomplish your level of performance?'},
  {id:'frustration', label:'Frustration', short:'FR', desc:'How insecure, discouraged, irritated, stressed, and annoyed were you?'},
];

// Generate all 15 unique pairs (6 choose 2), in a fixed, shuffled-once order
// matching the spirit of the official paper form (order doesn't affect scoring).
function generatePairs(){
  const pairs = [];
  for(let i = 0; i < DIMENSIONS.length; i++){
    for(let j = i+1; j < DIMENSIONS.length; j++){
      pairs.push([DIMENSIONS[i].id, DIMENSIONS[j].id]);
    }
  }
  return pairs;
}
const PAIRS = generatePairs(); // length 15

let meta = { pid:'', date:new Date().toISOString().slice(0,10), condition:'Adaptive System', order:'1st (first block completed)' };
let ratings = {};
DIMENSIONS.forEach(d => ratings[d.id] = 50);
let choices = {}; // pairIndex -> chosen dimension id
let step = 0; // 0 = session data, 1 = ratings, 2 = pairwise comparisons, 3 = review (experimenter)

function snapTo5(v){ return Math.round(v / 5) * 5; }
function dimById(id){ return DIMENSIONS.find(d => d.id === id); }

function render(){
  const shell = document.getElementById('shell');
  shell.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'labelband';
  header.innerHTML = `<div class="title">NASA-TLX</div><div class="tag">V2P Main Study</div>`;
  shell.appendChild(header);

  shell.appendChild(renderStepper());

  if(step === 0) renderStep0(shell);
  else if(step === 1) renderStep1(shell);
  else if(step === 2) renderStep2(shell);
  else renderStep3(shell);

  const footnote = document.createElement('footer');
  footnote.className = 'note';
  footnote.textContent = 'NASA Task Load Index (Hart & Staveland, 1988) -- V2P Adaptive Warning Study';
  shell.appendChild(footnote);
}

function renderStepper(){
  const labels = ['01 Session Data', '02 Ratings', '03 Comparisons', '04 Review'];
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;';
  labels.forEach((label, idx) => {
    const b = document.createElement('div');
    const isActive = idx === step;
    const isDone = idx < step;
    b.style.cssText = `font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;padding:6px 9px;border:1px solid ${isActive?'var(--ink)':(isDone?'var(--good)':'var(--line)')};border-radius:2px;background:${isActive?'var(--ink)':'var(--panel)'};color:${isActive?'var(--paper)':(isDone?'var(--good)':'var(--ink-soft)')};`;
    b.textContent = label;
    wrap.appendChild(b);
  });
  return wrap;
}

function attachMetaHandlers(){
  document.getElementById('m_pid').oninput = e => { meta.pid = e.target.value; };
  document.getElementById('m_date').oninput = e => { meta.date = e.target.value; };
  document.getElementById('m_condition').onchange = e => { meta.condition = e.target.value; };
  document.getElementById('m_order').onchange = e => { meta.order = e.target.value; };
}

/* ---------------- STEP 0: SESSION DATA ---------------- */
function renderStep0(shell){
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = 'Enter the session details below, then continue to the ratings.';
  shell.appendChild(banner);

  const metaCard = document.createElement('div');
  metaCard.className = 'meta-card';
  metaCard.innerHTML = `
    <h2>Session Details</h2>
    <div class="meta-grid">
      <div class="field"><label>Participant ID</label><input type="text" id="m_pid" placeholder="P01" value="${meta.pid}"></div>
      <div class="field"><label>Session date</label><input type="text" id="m_date" value="${meta.date}"></div>
      <div class="field"><label>Condition</label>
        <select id="m_condition">
          <option value="Adaptive System" ${meta.condition==='Adaptive System'?'selected':''}>Adaptive System</option>
          <option value="Fixed Baseline" ${meta.condition==='Fixed Baseline'?'selected':''}>Fixed Baseline</option>
        </select>
      </div>
      <div class="field"><label>Block order</label>
        <select id="m_order">
          <option value="1st (first block completed)" ${meta.order.startsWith('1st')?'selected':''}>1st (first block completed)</option>
          <option value="2nd (second block completed)" ${meta.order.startsWith('2nd')?'selected':''}>2nd (second block completed)</option>
        </select>
      </div>
    </div>
  `;
  shell.appendChild(metaCard);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  btnRow.innerHTML = `<span></span>`;
  const next = document.createElement('button');
  next.textContent = 'Continue to Ratings ->';
  next.onclick = () => {
    if(!meta.pid.trim()){ alert('Please enter a Participant ID before continuing.'); return; }
    step = 1; render();
  };
  btnRow.appendChild(next);
  shell.appendChild(btnRow);

  attachMetaHandlers();
}

/* ---------------- STEP 1: RATINGS (Part 1) ---------------- */
function renderStep1(shell){
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = 'Part 1 of 2: Rate each dimension for the block just completed. Part 2 (pairwise comparisons) follows on the next screen.';
  shell.appendChild(banner);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="step-tag">Part 1 -- Ratings</div><h2>Rate Each Dimension</h2><div class="sub">Scale of 0 (Low) to 100 (High), in steps of 5.</div>`;

  DIMENSIONS.forEach(d => {
    const val = ratings[d.id];
    const loLabel = d.id === 'performance' ? 'Good'  : 'Low';
    const hiLabel = d.id === 'performance' ? 'Poor'  : 'High';
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="qtext">${d.label}</div>
      <div class="qdesc">${d.desc}</div>
      <div class="scale-row">
        <span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);width:60px;">${loLabel}</span>
        <input type="range" min="0" max="100" step="5" value="${val}" id="r_${d.id}">
        <span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);width:60px;text-align:right;">${hiLabel}</span>
        <span class="scale-value" id="r_${d.id}_val">${val}</span>
      </div>
    `;
    card.appendChild(row);
  });
  shell.appendChild(card);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const back = document.createElement('button');
  back.className = 'ghost';
  back.textContent = '<- Back to Session Data';
  back.onclick = () => { step = 0; render(); };
  const next = document.createElement('button');
  next.textContent = 'Continue to Part 2 (Weights) ->';
  next.onclick = () => { step = 2; render(); };
  btnRow.appendChild(back);
  btnRow.appendChild(next);
  shell.appendChild(btnRow);

  DIMENSIONS.forEach(d => {
    const slider = document.getElementById(`r_${d.id}`);
    const valSpan = document.getElementById(`r_${d.id}_val`);
    slider.oninput = () => {
      const snapped = snapTo5(parseInt(slider.value));
      slider.value = snapped;
      ratings[d.id] = snapped;
      valSpan.textContent = snapped;
    };
  });
}

/* ---------------- STEP 2: PAIRWISE COMPARISONS ---------------- */
function renderStep2(shell){
  const answered = Object.keys(choices).length;
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `Part 2 of 2: For each pair, click the factor that contributed more to your workload during the block. ${answered}/15 answered.`;
  shell.appendChild(banner);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="step-tag">Part 2 -- Pairwise Comparisons</div><h2>Which Mattered More?</h2><div class="sub">15 pairs total. Click the side that was the bigger contributor to your workload.</div>`;

  PAIRS.forEach(([aId, bId], idx) => {
    const a = dimById(aId), b = dimById(bId);
    const chosen = choices[idx];
    const row = document.createElement('div');
    row.className = 'pair-item';
    row.innerHTML = `
      <div class="pair-counter">Pair ${idx+1} / 15</div>
      <div class="pair-choice-row">
        <div class="pair-choice${chosen===aId?' sel':''}" data-pair="${idx}" data-choice="${aId}">${a.label}</div>
        <div class="pair-vs">or</div>
        <div class="pair-choice${chosen===bId?' sel':''}" data-pair="${idx}" data-choice="${bId}">${b.label}</div>
      </div>
    `;
    card.appendChild(row);
  });
  shell.appendChild(card);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const back = document.createElement('button');
  back.className = 'ghost';
  back.textContent = '<- Back to Part 1';
  back.onclick = () => { step = 1; render(); };
  const next = document.createElement('button');
  next.textContent = 'Continue to Review ->';
  next.disabled = answered < 15;
  next.onclick = () => { if(Object.keys(choices).length === 15){ step = 3; render(); } };
  btnRow.appendChild(back);
  btnRow.appendChild(next);
  shell.appendChild(btnRow);

  shell.querySelectorAll('.pair-choice').forEach(el => {
    el.onclick = () => {
      const pairIdx = parseInt(el.dataset.pair);
      const choiceId = el.dataset.choice;
      choices[pairIdx] = choiceId;
      render(); // re-render step 2 to update selection state and counter/button
    };
  });
}

/* ---------------- STEP 3: REVIEW & EXPORT ---------------- */
function computeWeights(){
  const weights = {};
  DIMENSIONS.forEach(d => weights[d.id] = 0);
  Object.values(choices).forEach(chosenId => { weights[chosenId] += 1; });
  return weights;
}

function buildExportObject(){
  const weights = computeWeights();
  const rawVals = DIMENSIONS.map(d => ratings[d.id]);
  const rawMean = rawVals.reduce((a,b)=>a+b,0) / rawVals.length;

  let weightedSum = 0;
  DIMENSIONS.forEach(d => { weightedSum += ratings[d.id] * weights[d.id]; });
  const weightedScore = weightedSum / 15;

  const weightSum = Object.values(weights).reduce((a,b)=>a+b,0);

  return {
    instrument: 'NASA-TLX (full: ratings + pairwise weights)',
    participant_id: meta.pid,
    session_date: meta.date,
    condition: meta.condition,
    block_order: meta.order,
    ratings: { ...ratings },
    pairwise_choices: { ...choices },
    weights: { ...weights },
    weight_sum_check: weightSum, // should always be 15
    tlx_raw_mean: Math.round(rawMean * 100) / 100,
    tlx_weighted_score: Math.round(weightedScore * 100) / 100,
    exported_at: new Date().toISOString(),
  };
}

function renderStep3(shell){
  const obj = buildExportObject();

  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = 'Review below, then download. Data is kept only in this browser tab until you download.';
  shell.appendChild(banner);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="step-tag">For the Experimenter</div><h2>Review: Weights &amp; Scores</h2><div class="sub">Hand the device back to the experimenter for this final check before downloading.</div>`;

  const table = document.createElement('table');
  table.className = 'weights-table';
  table.innerHTML = `
    <tr><th>Dimension</th><th>Rating (0-100)</th><th>Tally (0-5)</th><th>Weight</th></tr>
    ${DIMENSIONS.map(d => `<tr>
      <td>${d.label}</td>
      <td>${obj.ratings[d.id]}</td>
      <td>${obj.weights[d.id]}</td>
      <td>${(obj.weights[d.id] / 15).toFixed(4)}</td>
    </tr>`).join('')}
  `;
  card.appendChild(table);

  const scoreP = document.createElement('div');
  scoreP.style.cssText = 'margin-top:16px;font-size:14px;line-height:1.8;';
  scoreP.innerHTML = `
    <strong>Raw TLX (unweighted mean):</strong> ${obj.tlx_raw_mean}<br>
    <strong>Weighted TLX score:</strong> ${obj.tlx_weighted_score}<br>
    <span style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);">Weight sum check: ${obj.weight_sum_check} (should be 15)</span>
  `;
  card.appendChild(scoreP);
  shell.appendChild(card);

  const exportCard = document.createElement('div');
  exportCard.className = 'card';
  exportCard.innerHTML = `<div class="sub" style="margin-bottom:14px;">Full export data:</div>`;
  const pre = document.createElement('div');
  pre.className = 'export-box';
  pre.textContent = JSON.stringify(obj, null, 2);
  exportCard.appendChild(pre);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const back = document.createElement('button');
  back.className = 'ghost';
  back.textContent = '<- Back to Part 2';
  back.onclick = () => { step = 2; render(); };
  const dlGroup = document.createElement('div');
  dlGroup.style.cssText = 'display:flex;gap:10px;';
  const dlCsvBtn = document.createElement('button');
  dlCsvBtn.className = 'ghost';
  dlCsvBtn.textContent = 'Download CSV row';
  dlCsvBtn.onclick = downloadCsv;
  const dlJsonBtn = document.createElement('button');
  dlJsonBtn.textContent = 'Download JSON';
  dlJsonBtn.onclick = downloadJson;
  dlGroup.appendChild(dlCsvBtn);
  dlGroup.appendChild(dlJsonBtn);
  btnRow.appendChild(back);
  btnRow.appendChild(dlGroup);
  shell.appendChild(btnRow);
}

function downloadJson(){
  if(!meta.pid.trim()){ alert('Please enter a Participant ID before downloading.'); return; }
  const obj = buildExportObject();
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${meta.pid}_TLX_${meta.condition.replace(/\s+/g,'')}_${meta.date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadCsv(){
  if(!meta.pid.trim()){ alert('Please enter a Participant ID before downloading.'); return; }
  const obj = buildExportObject();
  const headers = ['participant_id','session_date','condition','block_order',
    ...DIMENSIONS.map(d=>'rating_'+d.id),
    ...DIMENSIONS.map(d=>'weight_'+d.id),
    'tlx_raw_mean','tlx_weighted_score'];
  const row = [obj.participant_id, obj.session_date, obj.condition, obj.block_order,
    ...DIMENSIONS.map(d=>obj.ratings[d.id]),
    ...DIMENSIONS.map(d=>obj.weights[d.id]),
    obj.tlx_raw_mean, obj.tlx_weighted_score];
  const csv = headers.join(',') + '\n' + row.join(',');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${meta.pid}_TLX_${meta.condition.replace(/\s+/g,'')}_${meta.date}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
